name: Check schedule and post if due

on:
  schedule:
    # 15분마다 실행. GitHub 무료 크론은 정확히 그 분에 안 도는 경우가 있으니
    # 여유를 두고 싶으면 간격을 더 넓혀도 됩니다.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check schedule and post if due
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python main_post.py

      - name: Commit updated schedule state
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet || git commit -m "chore: mark slot as posted"
          git push
