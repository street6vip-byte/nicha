name: Telegram to X Auto Post

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 자동 검사
  workflow_dispatch:        # 수동 실행 버튼 활성화

permissions:
  contents: write            # 승인 대기 상태(pending_post.json)를 커밋하기 위해 필요

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main_post.py
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main_post.py

      - name: Commit pending approval state
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in pending_post.json pending schedule.json telegram_state.json; do
            if [ -e "$f" ]; then
              git add -A -- "$f"
            fi
          done
          git diff --cached --quiet || git commit -m "chore: update pending approval state"
          git push
