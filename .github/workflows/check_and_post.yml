name: Telegram to X Auto Post

on:
  repository_dispatch:
    types: [telegram_update]   # Cloudflare Worker가 텔레그램 웹훅을 받으면 즉시 트리거
  schedule:
    - cron: '*/15 * * * *'     # 웹훅 실패 대비 백업용 (승인 타임아웃 처리 등)
  workflow_dispatch:            # 수동 실행 버튼 활성화

permissions:
  contents: write                # 승인 대기 상태(pending_post.json)를 커밋하기 위해 필요

concurrency:
  group: nicha-check-and-post
  cancel-in-progress: false      # 이미 도는 실행은 끝까지 두고, 새 실행은 그게 끝날 때까지 대기

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save webhook payload (if triggered by webhook)
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: echo "$PAYLOAD" > telegram_update.json

      - name: Run main_post.py
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main_post.py

      - name: Commit pending approval state
        run: |
          git config user.name "auto-post-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in pending_post.json pending schedule.json telegram_state.json; do
            git add -A -- "$f" 2>/dev/null || true
          done
          git diff --cached --quiet || git commit -m "chore: update pending approval state"
          # 우리가 관리하지 않는 파일(telegram_image.jpg, telegram_update.json 등)에 생긴
          # 변경은 커밋 대상이 아니므로 rebase 전에 되돌려서 충돌을 방지합니다.
          git checkout -- . || true
          git clean -fd -- telegram_image.jpg telegram_update.json || true
          git pull --rebase origin main
          git push
